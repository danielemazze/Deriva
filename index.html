<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1f27">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deriva">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src 'self' ws: wss: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:">
<title>Deriva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Signika:wght@400;500;600&display=swap">
<style>
/* Concept: carta nautica e ottone sopra il mare — pannelli "acqua profonda", libro in pergamena */
:root {
  --deep: #0b1f27; --deep-2: #12303a; --panel: rgba(9, 26, 33, 0.86); --line: rgba(201, 162, 94, 0.32);
  --foam: #e8efe9; --mist: #a9bcb8; --brass: #c9a25e; --brass-hi: #ecd099; --coral: #ec7a5c; --kelp: #93c47d; --sky: #7cc6e0;
  --paper: #eadcbc; --paper-2: #dcc89f; --ink: #2a1f14; --ink-soft: #6b5638;
  --f-display: 'IM Fell English SC', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --f-book: 'IM Fell English', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --f-ui: 'Signika', 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
  --slot: 52px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; background: var(--deep); color: var(--foam); font-family: var(--f-ui); }
#game { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
.compass { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.compass .win { width: 300px; max-width: 70vw; height: 26px; overflow: hidden; position: relative; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
.compass .strip { position: absolute; top: 0; left: 0; height: 100%; white-space: nowrap; font-family: var(--f-display); font-size: 15px; color: var(--foam); text-shadow: 0 1px 2px #000; }
.compass .strip span { position: absolute; top: 4px; transform: translateX(-50%); }
.compass .strip span.min { color: var(--mist); font-size: 11px; top: 7px; }
.compass .strip span.n { color: var(--coral); }
.compass .needle { position: absolute; left: 50%; top: -2px; width: 2px; height: 8px; background: var(--brass-hi); transform: translateX(-50%); }
.clock { font-family: var(--f-display); font-size: 14px; letter-spacing: 0.06em; color: var(--brass-hi); text-shadow: 0 1px 3px #000; font-variant-numeric: tabular-nums; }

.tempinfo { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(118px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 4px 6px; max-width: 260px; font-size: 12px; color: var(--foam); text-shadow: 0 1px 3px #000; }
.tempinfo b { width: 100%; font-weight: 600; font-size: 13px; } .tempinfo b.up { color: #ffb070; } .tempinfo b.dn { color: #8fd0ff; }
.tempinfo span { background: rgba(6,18,23,.6); border-radius: 6px; padding: 1px 6px; } .tempinfo span.w { border-left: 3px solid #ff9a50; } .tempinfo span.c { border-left: 3px solid #6cc0ff; }
.tempinfo small { width: 100%; color: var(--mist); font-size: 11px; }
html.touch .tempinfo { top: calc(96px + env(safe-area-inset-top, 0px)); bottom: auto; left: max(12px, env(safe-area-inset-left, 0px)); max-width: 200px; font-size: 11px; }
.meters { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 7px; width: 200px; }
.meter { display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 8px; }
.meter svg { width: 20px; height: 20px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
.meter .bar { height: 9px; border-radius: 5px; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.12); overflow: hidden; position: relative; }
.meter .bar i { position: absolute; inset: 0; transform-origin: left; border-radius: 5px; transition: transform .25s; }
.meter[data-k=health] i { background: linear-gradient(90deg, #b8402e, #ec7a5c); }
.meter[data-k=hunger] i { background: linear-gradient(90deg, #a8742c, #e0b062); }
.meter[data-k=thirst] i { background: linear-gradient(90deg, #2c7fa8, #7cc6e0); }
.meter[data-k=oxygen] i { background: linear-gradient(90deg, #8fd0e6, #e8f6fb); }
.meter[data-k=temp] i { background: linear-gradient(90deg, #3b7fd0, #9fd2f5); }
.meter[data-k=temp][data-hot="1"] i { background: linear-gradient(90deg, #e8a03a, #e8573a); }
.meter.low .bar { animation: pulse 1s infinite; }
@keyframes pulse { 50% { border-color: var(--coral); box-shadow: 0 0 8px rgba(236,122,92,.6); } }

.hotbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 5px; background: rgba(6,18,23,0.62); border: 1px solid var(--line); border-radius: 10px; }
.heldname { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); font-size: 14px; color: var(--foam); text-shadow: 0 1px 3px #000; opacity: 0; transition: opacity .4s; white-space: nowrap; }
.heldname.show { opacity: 1; }
.slot { width: var(--slot); height: var(--slot); position: relative; border-radius: 7px; background: radial-gradient(circle at 50% 35%, rgba(42,78,88,.75), rgba(10,28,34,.85)); border: 1px solid rgba(255,255,255,0.09); box-shadow: inset 0 2px 6px rgba(0,0,0,.5); flex: none; }
.slot.sel { border-color: var(--brass-hi); box-shadow: 0 0 0 2px rgba(236,208,153,.35), inset 0 2px 6px rgba(0,0,0,.5); }
.slot img { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); image-rendering: auto; pointer-events: none; }
.slot b { position: absolute; right: 4px; bottom: 1px; font-size: 13px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000; pointer-events: none; font-variant-numeric: tabular-nums; }
.slot .key { position: absolute; left: 4px; top: 1px; font-size: 10px; color: var(--mist); pointer-events: none; }
.slot .ghosticon { opacity: .22; filter: grayscale(1); }

.cross { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 0 3px rgba(0,0,0,.8); }
.cross.charge { width: 30px; height: 30px; margin: -15px 0 0 -15px; background: conic-gradient(var(--brass-hi) var(--ch, 0deg), rgba(255,255,255,.18) 0); -webkit-mask: radial-gradient(circle, transparent 0 11px, #000 12px); mask: radial-gradient(circle, transparent 0 11px, #000 12px); box-shadow: none; }
.cross.hot { width: 18px; height: 18px; margin: -9px 0 0 -9px; background: transparent; border: 2px solid var(--brass-hi); }
.target { position: absolute; left: 50%; top: calc(50% + 24px); transform: translateX(-50%); text-align: center; text-shadow: 0 1px 3px #000, 0 0 6px rgba(0,0,0,.6); min-width: 240px; }
.target .tname { font-family: var(--f-display); font-size: 18px; color: var(--foam); }
.target .thint { font-size: 13px; color: var(--mist); margin-top: 2px; }
.target .thint kbd, .placebar kbd, .ctrl kbd { font-family: var(--f-ui); font-size: 11px; padding: 1px 5px; border-radius: 4px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.35); color: var(--foam); }
.target .thp { width: 120px; height: 4px; margin: 6px auto 0; background: rgba(0,0,0,.5); border-radius: 2px; overflow: hidden; }
.target .thp i { display: block; height: 100%; background: var(--brass-hi); transform-origin: left; }
.target .need { margin-top: 4px; font-size: 13px; }
.target .need.ok { color: var(--kelp); } .target .need.no { color: var(--coral); }

.toasts { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); top: calc(70px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; max-width: min(380px, 80vw); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--brass); padding: 7px 12px; border-radius: 6px; font-size: 14px; animation: tin .25s ease-out; }
.toast.good { border-left-color: var(--kelp); } .toast.warn { border-left-color: var(--coral); }
.toast.pick { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 6px; }
.toast.pick img { width: 26px; height: 26px; }
.toast.out { opacity: 0; transform: translateX(20px); transition: all .4s; }
@keyframes tin { from { opacity: 0; transform: translateX(16px); } }

.boathud { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: auto auto; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.boathud .spd { font-family: var(--f-display); font-size: 30px; line-height: 1; color: var(--brass-hi); font-variant-numeric: tabular-nums; }
.boathud .spd small { display: block; font-family: var(--f-ui); font-size: 11px; color: var(--mist); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.boathud canvas { width: 74px; height: 74px; }
.placebar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; font-size: 14px; white-space: nowrap; }
.placebar .err { color: var(--coral); margin-left: 8px; }
#dmg { position: absolute; inset: 0; pointer-events: none; }

/* ---------- PANNELLI (inventario, baule, falò) ---------- */
.overlay { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(4,14,18,.55), rgba(2,8,10,.82)); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: auto; }
.panel { background: linear-gradient(180deg, rgba(18,46,56,.96), rgba(9,26,33,.97)); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); padding: 18px; display: grid; gap: 16px; grid-template-columns: auto auto auto; align-items: start; max-width: 100%; }
.panel h3 { margin: 0 0 8px; font-family: var(--f-display); font-weight: 400; font-size: 20px; color: var(--brass-hi); letter-spacing: .03em; }
.panel h3 small { font-family: var(--f-ui); font-size: 12px; color: var(--mist); margin-left: 6px; letter-spacing: 0; }
.grid { display: grid; gap: 4px; }
.craftwrap { display: flex; align-items: center; gap: 14px; }
.arrow { width: 34px; height: 20px; position: relative; }
.arrow::before { content: ""; position: absolute; left: 0; right: 8px; top: 8px; height: 4px; background: var(--brass); border-radius: 2px; }
.arrow::after { content: ""; position: absolute; right: 0; top: 2px; border: 8px solid transparent; border-left: 10px solid var(--brass); border-right: 0; }
.slot.result { width: 64px; height: 64px; border-color: var(--brass); }
.slot:hover { border-color: rgba(236,208,153,.6); }
.slot.slot-ok { border-color: var(--kelp); }
.recq { width: 100%; box-sizing: border-box; height: 34px; margin: 0 0 8px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: rgba(0,0,0,.3); color: var(--foam); font-family: var(--f-ui); font-size: 14px; }
.recq:focus { outline: none; border-color: var(--brass-hi); }
.reccats { width: 230px; display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.rcat { font-family: var(--f-ui); font-size: 12px; padding: 3px 8px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--foam); cursor: pointer; }
.rcat small { color: var(--mist); font-size: 10px; } .rcat.on { background: rgba(201,162,94,.3); border-color: var(--brass-hi); } .rcat.none { opacity: .4; }
.reclist { width: 230px; max-height: 390px; overflow: auto; display: grid; gap: 4px; padding-right: 4px; align-content: start; }
.rec { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: 6px; background: rgba(255,255,255,.03); border: 1px solid transparent; cursor: pointer; color: var(--mist); font-size: 13px; text-align: left; }
.rec img { width: 30px; height: 30px; }
.rec.can { color: var(--foam); }
.rec.can .n { color: var(--kelp); }
.rec:hover { border-color: var(--line); background: rgba(255,255,255,.06); }
.rec .n { font-size: 11px; color: var(--mist); font-variant-numeric: tabular-nums; }
.rec .lock { font-size: 10px; color: var(--brass); }
.invcol { display: grid; gap: 10px; }
.hint { font-size: 12px; color: var(--mist); max-width: 470px; line-height: 1.45; }
.cookbar { width: 46px; height: 8px; border-radius: 4px; background: rgba(0,0,0,.4); overflow: hidden; }
.cookbar i { display: block; height: 100%; background: linear-gradient(90deg, #e2461e, #ffb84a); transform-origin: left; }
#cursorItem { position: fixed; width: 46px; height: 46px; pointer-events: none; z-index: 50; transform: translate(-50%, -50%); }
#cursorItem img { width: 100%; height: 100%; }
#cursorItem b { position: absolute; right: -2px; bottom: -4px; font-size: 13px; font-weight: 600; text-shadow: 0 1px 2px #000; }
#tooltip { position: fixed; z-index: 60; pointer-events: none; background: rgba(6,18,23,.96); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; max-width: 260px; font-size: 13px; }
#tooltip .tn { font-family: var(--f-display); font-size: 16px; color: var(--brass-hi); }
#tooltip .td { color: var(--mist); margin-top: 2px; line-height: 1.4; }
#tooltip .tf { color: var(--kelp); margin-top: 3px; font-size: 12px; }

/* ---------- costruzione barca ---------- */
.boatpanel { display: grid; gap: 12px; width: min(560px, 90vw); }
.bprog { height: 6px; border-radius: 3px; background: rgba(0,0,0,.4); overflow: hidden; }
.bprog i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass), var(--kelp)); transform-origin: left; }
.bparts { display: grid; gap: 6px; max-height: 52vh; overflow: auto; padding-right: 4px; }
.bpart { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; padding: 6px 10px 6px 6px; border-radius: 8px; background: rgba(255,255,255,.04); border: 1px solid transparent; }
.bpart img { width: 36px; height: 36px; }
.bpart b { display: block; font-weight: 500; font-size: 15px; }
.bpart small { color: var(--mist); font-size: 12px; }
.bpart.ok { border-color: rgba(147,196,125,.45); }
.bpart.no small { color: var(--coral); }
.bpart.done { opacity: .6; }
.bpart .tick { color: var(--kelp); font-size: 13px; }
.mini-btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--brass); background: var(--brass); color: #1d150b; cursor: pointer; }
.mini-btn:disabled, .mbtn:disabled { opacity: .35; cursor: not-allowed; filter: grayscale(1); }
.bactions { display: flex; gap: 8px; flex-wrap: wrap; }
.bactions .mbtn { font-size: 18px; }
/* ---------- LIBRO ---------- */
.book { width: min(1060px, 96vw); max-height: 92vh; display: grid; grid-template-columns: 1fr 1fr; position: relative; filter: drop-shadow(0 30px 50px rgba(0,0,0,.6)); }
.page { background: radial-gradient(ellipse at 30% 20%, #f2e6c8, var(--paper) 45%, var(--paper-2)); color: var(--ink); padding: 28px 30px 22px; font-family: var(--f-book); overflow: auto; max-height: 92vh; position: relative; }
.page.l { border-radius: 10px 2px 2px 10px; box-shadow: inset -24px 0 30px -18px rgba(90,60,20,.45); }
.page.r { border-radius: 2px 10px 10px 2px; box-shadow: inset 24px 0 30px -18px rgba(90,60,20,.45); }
.page::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, transparent 0 28px, rgba(120,90,40,.05) 28px 29px); border-radius: inherit; }
.book h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; margin: 0; color: #3a2714; text-wrap: balance; }
.book h2 { font-family: var(--f-display); font-weight: 400; font-size: 23px; margin: 0 0 4px; color: #3a2714; }
.book .sub { font-style: italic; color: var(--ink-soft); margin: 2px 0 16px; }
.book p { line-height: 1.5; margin: 0 0 10px; max-width: 62ch; }
.tabs { display: flex; gap: 6px; margin: 0 0 16px; flex-wrap: wrap; }
.tab { font-family: var(--f-display); font-size: 16px; padding: 5px 14px; border: 1px solid rgba(60,40,20,.35); border-radius: 16px; background: transparent; color: var(--ink); cursor: pointer; }
.tab.on { background: #3a2714; color: var(--paper); border-color: #3a2714; }
.boatlist { display: grid; gap: 10px; }
.bcard { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 10px; border: 1px solid rgba(60,40,20,.25); border-radius: 8px; cursor: pointer; background: rgba(255,250,235,.35); text-align: left; color: var(--ink); font-family: var(--f-book); }
.bcard.on { border-color: #3a2714; background: rgba(255,250,235,.7); box-shadow: inset 0 0 0 1px #3a2714; }
.bcard canvas { width: 120px; height: 70px; }
.bcard strong { font-family: var(--f-display); font-weight: 400; font-size: 18px; display: block; }
.bcard span { font-size: 13px; color: var(--ink-soft); }
.mats { display: grid; gap: 5px; margin: 10px 0 14px; }
.mat { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; font-size: 15px; border-bottom: 1px dotted rgba(60,40,20,.3); padding-bottom: 4px; }
.mat img { width: 28px; height: 28px; filter: sepia(.25); }
.mat em { font-style: normal; font-variant-numeric: tabular-nums; }
.mat.ok em { color: #3f6b24; } .mat.no em { color: #9a3a1e; }
.partlist { font-size: 13px; color: var(--ink-soft); columns: 2; column-gap: 18px; margin: 0 0 12px; padding: 0; list-style: none; }
.partlist li { break-inside: avoid; margin-bottom: 3px; }
.bigbtn { font-family: var(--f-display); font-size: 18px; padding: 10px 18px; border-radius: 8px; border: 0; background: #3a2714; color: var(--paper); cursor: pointer; box-shadow: 0 3px 0 #1d140a; }
.bigbtn:hover { background: #4d3519; }
.bigbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1d140a; }
.stat { display: flex; gap: 16px; font-size: 14px; color: var(--ink-soft); margin: 6px 0; }
.stat b { color: var(--ink); font-weight: 400; font-family: var(--f-display); font-size: 17px; }
.recgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.rcard { border: 1px solid rgba(60,40,20,.22); border-radius: 8px; padding: 8px; background: rgba(255,250,235,.35); display: grid; gap: 6px; justify-items: center; text-align: center; }
.rcard .mini { display: grid; gap: 2px; }
.rcard .mini div { width: 20px; height: 20px; border: 1px solid rgba(60,40,20,.2); background: rgba(60,40,20,.06); border-radius: 3px; }
.rcard .mini img { width: 18px; height: 18px; }
.rcard .nm { font-size: 13px; line-height: 1.2; }
.rcard .badge { font-size: 11px; color: var(--ink-soft); font-style: italic; }
.ctrl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; align-items: center; }
.ctrl kbd { background: #3a2714; color: var(--paper); border: 0; padding: 2px 7px; }
.close-x { position: absolute; top: 10px; right: 12px; border: 0; background: transparent; color: var(--ink); font-size: 26px; line-height: 1; cursor: pointer; z-index: 2; font-family: var(--f-display); }
.panel .close-x { color: var(--mist); }

/* ---------- MENU ---------- */
#menu { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(300px, 440px) 1fr; background: linear-gradient(90deg, rgba(6,18,23,.92) 0%, rgba(6,18,23,.7) 34%, rgba(6,18,23,0) 70%); }
#menu .side { padding: calc(36px + env(safe-area-inset-top, 0px)) 28px calc(24px + env(safe-area-inset-bottom, 0px)) max(40px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; overflow: auto; }
.logo { font-family: var(--f-display); font-size: 46px; line-height: 1; color: var(--foam); letter-spacing: .01em; margin: 0; text-shadow: 0 4px 30px rgba(0,0,0,.4); }
.logo-sub { font-family: var(--f-book); font-style: italic; color: var(--brass-hi); font-size: 14px; margin-top: 2px; }
.coords { font-family: var(--f-ui); font-size: 11px; color: var(--mist); letter-spacing: .16em; text-transform: uppercase; }
.mbtns { display: grid; gap: 8px; max-width: 300px; }

#loading { position: absolute; left: max(40px, env(safe-area-inset-left, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 300px; max-width: calc(100vw - 80px); }

.plist-hud { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); top: calc(44px + env(safe-area-inset-top, 0px)); list-style: none; margin: 0; padding: 6px 10px; background: rgba(6,18,23,.55); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; display: grid; gap: 3px; min-width: 140px; }

}
